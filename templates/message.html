<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ title }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@420;560&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="mast">
    <div class="wrap mast-inner">
      <p class="eyebrow">Školní jídelna</p>
      <h1>{{ title }}</h1>
    </div>
  </header>
  <main class="wrap">
    <section class="panel">
      <p>{{ text }}</p>
      {% if kind != "setup" %}
        <p><a class="text-link" href="/">Zpět na přehled</a></p>
      {% endif %}
    </section>
  </main>
</body>
</html>
