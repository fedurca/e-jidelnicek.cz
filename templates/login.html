<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Vstup k obědům</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@420;560&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="mast">
    <div class="wrap mast-inner">
      <p class="eyebrow">Školní jídelna</p>
      <h1>Vstup k obědům</h1>
    </div>
  </header>
  <main class="wrap">
    <section class="panel">
      {% if error %}<p class="flash flash-bad">{{ error }}</p>{% endif %}
      <form method="post" action="/vstup">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <label for="kod">Přístupový kód</label>
        <input id="kod" name="kod" type="password" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary">Vstoupit</button>
      </form>
    </section>
  </main>
</body>
</html>
